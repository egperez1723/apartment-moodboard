<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Our Little Place</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move-In">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#fbf5e8;
    --paper:#fffdf8;
    --ink:#4a3f31;
    --ink-soft:#8a7c67;
    --blush:#f3c9c0;
    --sage:#b7c7a3;
    --sage-dark:#8fa478;
    --butter:#f3d98e;
    --lavender:#dcc9e8;
    --terracotta:#d98a63;
    --line:#e6dcc6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--cream);
    background-image: radial-gradient(circle at 1px 1px, rgba(74,63,49,0.06) 1px, transparent 0);
    background-size: 20px 20px;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  .hand{ font-family:'Fraunces', serif; font-style:italic; }

  .wrap{ max-width: 820px; margin:0 auto; padding: 26px 16px 0 16px; }

  header{ text-align:center; margin-bottom: 18px; }
  .eyebrow{ font-size:12px; color:var(--ink-soft); letter-spacing:2px; text-transform:uppercase; }
  .title{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size: 40px; color: var(--ink); margin: 4px 0 0 0; }
  .title .heart{ color: var(--terracotta); }
  .subtitle{ font-size: 13px; color: var(--ink-soft); margin-top: 2px; }

  .countdown-card{
    background: var(--paper);
    border: 2px dashed var(--sage-dark);
    border-radius: 18px;
    padding: 14px 18px;
    max-width: 320px;
    margin: 18px auto 20px auto;
    text-align:center;
    box-shadow: 3px 4px 0 rgba(74,63,49,0.08);
    position: relative;
  }
  .countdown-num{ font-family:'Fraunces', serif; font-style:italic; font-size: 40px; font-weight:500; color: var(--terracotta); line-height:1; }
  .countdown-label{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .countdown-editbtn{ position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%; background: var(--paper); border: 1.5px solid var(--sage-dark); color:var(--sage-dark); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .countdown-editbtn svg{ width:13px; height:13px; }
  .date-editor{ margin-top:10px; display:flex; gap:6px; justify-content:center; align-items:center; }
  .date-editor input{ font-family:'Work Sans', sans-serif; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background: var(--cream); }
  .date-editor button{ font-family:'Work Sans', sans-serif; font-weight:600; font-size:12px; background: var(--sage-dark); color:white; border:none; border-radius:8px; padding:7px 12px; cursor:pointer; }

  .info-section{
    margin: 0 0 30px 0;
  }
  .quick-access-row{ display:flex; gap:10px; margin-bottom:24px; }
  .quick-access-btn{ display:flex; align-items:center; gap:7px; font-family:'Work Sans', sans-serif; font-weight:600; font-size:12px; letter-spacing:0.5px; color:var(--terracotta); background:rgba(217,138,99,0.12); padding:9px 16px; border-radius:20px; cursor:pointer; }
  .quick-access-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .modal-closerow{ display:flex; justify-content:flex-end; margin-bottom:8px; }

  .index-card{ background:var(--paper); border-radius:4px; box-shadow:0 4px 14px rgba(74,63,49,0.18); overflow:hidden; }
  .index-card-band{ background:var(--terracotta); color:#fffdf8; font-family:'Work Sans', sans-serif; font-weight:700; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; }
  .index-card-editbtn{ width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .index-card-editbtn svg{ width:11px; height:11px; }
  .index-card-body{ padding:14px 16px; }
  .index-card-row{ display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:8px 0; border-bottom:1px solid var(--cream); color:var(--ink); }
  .index-card-row:last-child{ border-bottom:none; }
  .index-card-label{ color:var(--ink-soft); text-transform:lowercase; flex-shrink:0; }
  .index-card-value{ font-weight:500; text-align:right; word-break:break-word; }
  .info-header-actions{ display:flex; align-items:center; gap:8px; }
  .info-header-title{ font-family:'Work Sans', sans-serif; font-weight:700; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--terracotta); cursor:pointer; display:flex; align-items:center; gap:8px; background:rgba(217,138,99,0.14); padding:8px 14px; border-radius:20px; }
  .info-chevron{ font-size:13px; color:var(--terracotta); transition: transform 0.2s ease; display:inline-block; }
  .info-chevron.collapsed{ transform: rotate(-90deg); }
  .info-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .info-tile{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .info-tile.wide{ grid-column:1 / 3; }
  .info-tile-label{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:3px; }
  .info-tile-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .info-tile-value{ font-size:14px; color:var(--ink); font-weight:500; word-break:break-word; }
  .info-copy-btn{ width:22px; height:22px; border-radius:50%; background:var(--cream); border:1px solid var(--line); color:var(--sage-dark); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .info-copy-btn svg{ width:11px; height:11px; }
  .info-copy-btn.copied{ background:var(--sage); border-color:var(--sage-dark); }
  .info-editbtn{ width:28px; height:28px; border-radius:50%; background: var(--cream); border: 1.5px solid var(--sage-dark); color:var(--sage-dark); cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0; }
  .info-editbtn svg{ width:14px; height:14px; }
  .info-empty{ text-align:left; font-size:13px; color:var(--ink-soft); font-style:italic; }
  .info-modal input{ width:100%; font-family:'Work Sans', sans-serif; font-size:14px; padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; background:var(--cream); margin-bottom:10px; }
  .info-field-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1px; margin:2px 0 4px 0; }

  .receipt{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 18px 16px;
    font-family: 'Work Sans', sans-serif;
    box-shadow: 0 3px 10px rgba(74,63,49,0.08);
    background-image:
      linear-gradient(135deg, var(--paper) 8px, transparent 0),
      linear-gradient(-135deg, var(--paper) 8px, transparent 0),
      linear-gradient(45deg, var(--paper) 8px, transparent 0),
      linear-gradient(-45deg, var(--paper) 8px, transparent 0);
    background-position: top left, top right, bottom left, bottom right;
    background-size: 16px 16px;
    background-repeat: no-repeat;
  }
  .receipt-row{ display:flex; align-items:baseline; gap:6px; font-size:12.5px; padding:4px 0; color:var(--ink); }
  .receipt-row.done{ color:var(--sage-dark); }
  .receipt-item{ flex-shrink:0; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .receipt-dots{ flex:1; border-bottom:1px dotted var(--line); margin-bottom:3px; }
  .receipt-price{ flex-shrink:0; font-weight:600; }
  .receipt-divider{ border-top:1px dashed var(--line); margin:8px 0; }
  .receipt-total{ font-size:13.5px; font-weight:700; }
  .receipt-total.spent{ color:var(--sage-dark); }

  .quick-section{
    background: var(--paper);
    border: 2px dashed var(--butter);
    border-radius: 18px;
    padding: 18px 22px;
    margin: 0 0 34px 0;
  }
  .quick-title{ font-family:'Fraunces', serif; font-style:italic; font-size:22px; margin-bottom:2px; }
  .quick-subtitle{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .quick-list{ list-style:none; margin:0 0 10px 0; padding:0; }
  .quick-item{ display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .quick-item:last-child{ border-bottom:none; }
  .quick-check{ width:19px; height:19px; border-radius:50%; border:1.6px solid var(--sage-dark); background:var(--cream); cursor:pointer; flex-shrink:0; position:relative; }
  .quick-check.done{ background:var(--sage); border-color:var(--sage-dark); }
  .quick-check.done::after{ content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid white; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .quick-text{ flex:1; cursor:pointer; }
  .quick-text.done{ text-decoration:line-through; color:var(--ink-soft); }
  .quick-del{ font-size:13px; color:var(--line); cursor:pointer; }
  .quick-del:hover{ color:var(--terracotta); }
  .quick-add-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .quick-add-row input{ flex:1; min-width:0; font-family:'Work Sans', sans-serif; font-size:14px; padding:8px 11px; border:1.5px solid var(--line); border-radius:10px; background:var(--cream); box-sizing:border-box; }
  .quick-price-input{ flex:0 0 60px !important; min-width:0 !important; box-sizing:border-box; }
  .quick-price{ color:var(--sage-dark); font-weight:600; font-size:12.5px; }
  .budget-summary{ display:flex; gap:10px; margin:-2px 0 12px 0; }
  .budget-stat{ flex:1; background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:8px 10px; text-align:center; }
  .budget-label{ display:block; font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
  .budget-amt{ display:block; font-size:16px; font-weight:600; color:var(--ink); }
  .budget-amt.spent{ color:var(--sage-dark); }
  .quick-item-edit{ gap:6px; }
  .quick-edit-input{ flex:1; font-family:'Work Sans', sans-serif; font-size:13px; padding:5px 8px; border:1.5px solid var(--sage-dark); border-radius:6px; background:var(--cream); }
  .quick-edit-price{ flex:0 0 54px; font-family:'Work Sans', sans-serif; font-size:13px; padding:5px 6px; border:1.5px solid var(--sage-dark); border-radius:6px; background:var(--cream); }

  .todo-section{
    background: var(--paper);
    border: 2px dashed var(--lavender);
    border-radius: 18px;
    padding: 18px 22px;
    margin: 0 0 34px 0;
  }
  .todo-title{ font-family:'Fraunces', serif; font-style:italic; font-size:22px; margin-bottom:2px; }
  .todo-subtitle{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .todo-list{ list-style:none; margin:0 0 10px 0; padding:0; }
  .todo-item{ display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .todo-item:last-child{ border-bottom:none; }
  .todo-check{ width:19px; height:19px; border-radius:5px; border:1.6px solid #9b7fb0; background:var(--cream); cursor:pointer; flex-shrink:0; position:relative; }
  .todo-check.done{ background:var(--lavender); border-color:#9b7fb0; }
  .todo-check.done::after{ content:""; position:absolute; left:5px; top:1px; width:5px; height:10px; border:solid #4a3f31; border-width:0 2px 2px 0; transform:rotate(40deg); }
  .todo-text{ flex:1; cursor:pointer; }
  .todo-text.done{ text-decoration:line-through; color:var(--ink-soft); }
  .todo-del{ font-size:13px; color:var(--line); cursor:pointer; }
  .todo-del:hover{ color:var(--terracotta); }
  .todo-add-row{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .todo-add-row input{ flex:1; font-family:'Work Sans', sans-serif; font-size:14px; padding:8px 11px; border:1.5px solid var(--line); border-radius:10px; background:var(--cream); }

  .tab-bar{ display:flex; gap:8px; margin-bottom:24px; }
  .tab-btn{ flex:1; text-align:center; font-family:'Work Sans', sans-serif; font-weight:600; font-size:13px; padding:10px; border-radius:14px; border:2px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; }
  .tab-btn.active{ background:var(--terracotta); border-color:var(--terracotta); color:white; }

  .new-cat-row{ display:flex; gap:8px; margin-bottom: 26px; justify-content:center; align-items:center; }
  .round-plus{ width:34px; height:34px; border-radius:50%; border:2px solid var(--terracotta); background:var(--paper); color:var(--terracotta); font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(74,63,49,0.35); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-box{ background:var(--paper); border-radius:18px; padding:22px 22px 18px 22px; max-width:300px; width:100%; box-shadow: 4px 6px 0 rgba(74,63,49,0.15); text-align:center; }
  .modal-box-lg{ max-width:360px; max-height:82vh; overflow-y:auto; text-align:left; }
  .modal-box-lg .modal-title{ text-align:center; }
  .modal-box-lg input[type=text]{ width:100%; font-family:'Work Sans', sans-serif; font-size:14px; padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; background:var(--cream); margin-bottom:10px; }
  .modal-section-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:1px; margin:10px 0 4px 0; }
  .modal-box .modal-title{ font-family:'Fraunces', serif; font-style:italic; font-size:20px; margin-bottom:12px; }
  .modal-box input{ width:100%; font-family:'Work Sans', sans-serif; font-size:14px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:var(--cream); margin-bottom:14px; }
  .modal-actions{ display:flex; gap:8px; justify-content:center; }
  .modal-actions button{ font-family:'Work Sans', sans-serif; font-weight:600; font-size:13px; border-radius:14px; padding:8px 16px; cursor:pointer; border:none; }
  .modal-add{ background:var(--terracotta); color:white; }
  .modal-cancel{ background:none; color:var(--ink-soft); border:1.5px solid var(--line) !important; }
  .inline-add-input{ font-family:'Work Sans', sans-serif; font-size: 14px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 20px; background: var(--paper); max-width: 220px; }

  .board-cat{ margin-bottom: 34px; }
  .cat-header{ display:flex; align-items:baseline; gap: 10px; margin-bottom: 12px; padding: 0 4px; }
  .cat-name{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size: 24px; cursor: text; border-bottom: 2px solid var(--butter); padding-bottom: 1px; }
  .cat-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .cat-meta{ font-size:11px; color: var(--ink-soft); }
  .cat-edit-row{ display:flex; justify-content:flex-end; margin: -8px 0 12px 0; }
  .cat-edit-toggle{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--line); background:var(--paper); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px; font-family:'Work Sans', sans-serif; font-weight:600; }
  .cat-edit-toggle svg{ width:14px; height:14px; }
  .cat-del-icon{ width:22px; height:22px; border-radius:50%; background:var(--terracotta); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11px; flex-shrink:0; }
  .cat-edit-actions{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .cat-move-btn{ width:22px; height:22px; border-radius:50%; background:var(--paper); border:1.5px solid var(--line); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; flex-shrink:0; }

  .cards-grid{ column-count: 2; column-gap: 14px; padding-top: 16px; }
  @media (min-width: 560px){ .cards-grid{ column-count: 3; } }
  .card{ break-inside: avoid; display:inline-block; width:100%; margin-bottom:14px; }

  .card{ background: var(--paper); border-radius: 14px; padding: 14px; position: relative; box-shadow: 2px 3px 0 rgba(74,63,49,0.08); border: 1px solid var(--line); }

  .washi{ position:absolute; top:-9px; left: 16px; width: 44px; height: 16px; opacity:0.85; border-radius: 2px; }
  .washi2{ position:absolute; top:-7px; right: 18px; width: 34px; height: 14px; opacity:0.8; border-radius: 2px; transform: rotate(6deg); }
  .washi3{ position:absolute; bottom:-7px; left: 40%; width: 30px; height: 13px; opacity:0.75; border-radius: 2px; transform: rotate(-4deg); }

  .card-top{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:8px; position:relative; }
  .card-title{ font-size: 15px; font-weight: 600; line-height:1.3; text-align:center; cursor:text; outline:none; }
  .card-title-static{ font-size: 15px; font-weight: 600; line-height:1.3; text-align:center; }
  .title-dots{ text-align:center; color: var(--terracotta); font-size:10px; letter-spacing:4px; margin: -3px 0 8px 0; opacity:0.7; }
  .card-del{ position:absolute; top:-2px; right:0; font-size: 13px; color: var(--ink-soft); cursor:pointer; flex-shrink:0; }
  .doodle{ width:16px; height:16px; flex-shrink:0; opacity:0.75; }
  .sub-badge{ font-size:10px; color:var(--ink-soft); background:var(--cream); border:1px solid var(--line); border-radius:10px; padding:1px 7px; flex-shrink:0; }
  .card-price-tag{ font-size:10px; color:var(--sage-dark); background:rgba(143,164,120,0.15); border-radius:10px; padding:1px 7px; flex-shrink:0; font-weight:600; }
  .modal-price-input{ width:100%; font-family:'Work Sans', sans-serif; font-size:13px; padding:7px 10px; border:1.5px solid var(--line); border-radius:8px; background:var(--cream); margin:8px 0 4px 0; }
  .card-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding-top:8px; border-top:1px dashed var(--line); }
  .expand-btn{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); background:var(--cream); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .item-done-btn{ width:32px; height:32px; border-radius:50%; background:var(--sage-dark); color:white; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .item-done-btn svg{ width:16px; height:16px; }
  .expand-btn svg{ width:12px; height:12px; }
  .card{ cursor:pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .card:hover{ box-shadow: 3px 5px 0 rgba(74,63,49,0.1); }
  .card:nth-child(3n){ transform: rotate(-0.6deg); }
  .card:nth-child(3n+1){ transform: rotate(0.5deg); }
  .card:nth-child(3n+2){ transform: rotate(-0.2deg); }
  .card:hover{ transform: rotate(0deg) translateY(-2px); }
  .card :is(input, textarea, a, .sub-check, .sub-text, .sub-del, .card-title, .card-del, .mini-plus, .img-del, .link-del, .add-img-btn){ cursor: auto; }
  .card-del:hover{ color: var(--terracotta); }

  /* images */
  .img-grid{ display:grid; gap:5px; margin-bottom:10px; border-radius:10px; overflow:hidden; }
  .img-grid.n1{ grid-template-columns: 1fr; }
  .img-grid.n2{ grid-template-columns: 1fr 1fr; }
  .img-grid.n3{ grid-template-columns: 1fr 1fr; }
  .img-grid.n3 .img-thumb-wrap:first-child{ grid-column: 1 / 3; }
  .img-grid.nmany{ grid-template-columns: 1fr 1fr; }
  .img-thumb-wrap{ position:relative; }
  .img-grid img{ width:100%; height:100%; min-height:70px; max-height:170px; object-fit:cover; display:block; }
  .img-grid.n1 img{ max-height:220px; }
  .img-del{ position:absolute; top:5px; right:5px; background:rgba(255,253,248,0.9); border:1px solid var(--line); border-radius:50%; width:18px; height:18px; font-size:10px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); }
  .add-img-btn{ width:100%; height:44px; border-radius:8px; border:2px dashed var(--line); background:var(--cream); color:var(--ink-soft); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-bottom:10px; }
  .add-img-btn input{ display:none; }

  /* subitems */
  .subitems{ list-style:none; margin:0 0 8px 0; padding:0; }
  .subitem{ display:flex; align-items:center; gap:7px; padding: 4px 0; font-size: 13px; }
  .sub-check{ width:15px; height:15px; border:1.5px solid var(--sage-dark); border-radius:4px; cursor:pointer; flex-shrink:0; position:relative; background:var(--cream); }
  .sub-check.done{ background:var(--sage); border-color:var(--sage-dark); }

function normalizeState(){

    if(!restoreCat){
      restoreCat = {id: uid(), name: 'previously completed', items: []};
      state.categories.push(restoreCat);

    state.bought.forEach(b => {
      restoreCat.items.push({id: b.id || uid(), title: b.title || 'item', notes:'', images:[], links:[], subitems:[], completed:true});
    });
    state.bought = [];
  }
}

async function loadData(){
  // local fallback so something shows immediately / if offline
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  }catch(e){ state = defaultState(); }
  normalizeState();
  render();

  // live sync from Firestore — this is the source of truth once it connects
  boardRef.onSnapshot((doc) => {
    firestoreReady = true;
    if(doc.metadata.hasPendingWrites){
      // this is our own local write already reflected on screen — skip re-render so it doesn't steal focus
      isFirstSnapshot = false;
      return;
    }
    if(doc.exists){
      let incoming;
      try{
        incoming = doc.data().state ? JSON.parse(doc.data().state) : null;
      }catch(e){
        console.error('Firestore data corrupt, keeping current state', e);
        incoming = null;
      }
      if(incoming){
        // safety check: never silently accept a drastic, unexplained data loss from the cloud
        const incomingCatCount = (incoming.categories||[]).length;
        const currentCatCount = (state.categories||[]).length;
        if(currentCatCount >= 3 && incomingCatCount === 0 && !doc.data().intentionalEmpty){
          console.error('Blocked a sync that would have wiped', currentCatCount, 'categories down to 0. Keeping current data and backing it up locally.');
          saveLocalBackup(state);
          isFirstSnapshot = false;
          return;
        }
        state = incoming;
      }
    } else if(isFirstSnapshot && !localStorage.getItem(EVER_CONNECTED_KEY)){
      // genuinely brand new — nothing in Firestore yet, push up whatever we have locally
      boardRef.set({state: JSON.stringify(state)});
    }
    localStorage.setItem(EVER_CONNECTED_KEY, '1');
    isFirstSnapshot = false;
    normalizeState();
    saveLocalBackup(state);
    render();
  }, (err) => {
    console.error('Firestore sync error', err);
  });
}

const EVER_CONNECTED_KEY = 'apartment-moodboard-ever-connected';
const BACKUP_KEY_PREFIX = 'apartment-moodboard-autobackup-';
const BACKUP_SLOT_COUNT = 3;

function saveLocalBackup(s){
  try{
    // rotate: shift older backups back before writing the newest into slot 0
    for(let i = BACKUP_SLOT_COUNT - 1; i > 0; i--){
      const prev = localStorage.getItem(BACKUP_KEY_PREFIX + (i-1));
      if(prev) localStorage.setItem(BACKUP_KEY_PREFIX + i, prev);
    }
    localStorage.setItem(BACKUP_KEY_PREFIX + '0', JSON.stringify({when: Date.now(), state: s}));
  }catch(e){ console.error('local backup failed', e); }
}

function getNewestLocalBackup(){
  for(let i = 0; i < BACKUP_SLOT_COUNT; i++){
    const raw = localStorage.getItem(BACKUP_KEY_PREFIX + i);
    if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  }
  return null;
}

async function saveData(intentionalEmpty){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error('local save failed', e); }
  saveLocalBackup(state);
  try{ await boardRef.set({state: JSON.stringify(state), intentionalEmpty: !!intentionalEmpty}); }
  catch(e){
    console.error('cloud save failed', e);
    alert('Your change saved on this device, but failed to sync to the cloud (' + (e.message || 'unknown error') + '). It will keep retrying — if this keeps happening, tell Claude.');
  }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const [datePart, timePart] = dateStr.split('T');
  const [y, m, dd] = datePart.split('-').map(Number);
  const [hh, mm] = (timePart || '00:00').split(':').map(Number);
  const target = new Date(y, m - 1, dd, hh, mm, 0, 0);
  const now = new Date();
  const diffMs = target - now;
  const totalMinutes = Math.floor(diffMs / (1000*60));
  const totalHours = Math.floor(totalMinutes / 60);
  const days = Math.floor(Math.abs(totalHours) / 24) * (totalHours < 0 ? -1 : 1);
  const hours = totalHours - days*24;
  return {days, hours: Math.abs(hours), totalHours, past: diffMs < 0};
}

function compressImage(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function renderCountdown(){
  const d = daysUntil(state.moveInDate);
  let inner;
  if(state.moveInDate === null){
    inner = `<div class="hand" style="font-size:18px; color:var(--ink-soft);">no move-in date set yet</div>`;
  } else if(!d.past && d.totalHours > 0){
    inner = `<div class="countdown-num">${d.days}<span style="font-size:20px;">d</span> ${d.hours}<span style="font-size:20px;">h</span></div><div class="countdown-label">until move-in</div>`;
  } else if(d.totalHours === 0){
    inner = `<div class="countdown-num hand">today!</div><div class="countdown-label">move-in day is here</div>`;
  } else {
    const agoHours = Math.abs(d.totalHours);
    const agoDays = Math.floor(agoHours/24);
    inner = `<div class="countdown-num hand">home</div><div class="countdown-label">moved in ${agoDays} day${agoDays===1?'':'s'} ago</div>`;
  }
  return `<div class="countdown-card">
    ${inner}
    <button class="countdown-editbtn" id="editDateLink" title="edit move-in date">${PENCIL_ICON}</button>
    ${editingDate ? `<div class="date-editor"><input type="datetime-local" id="dateInput" value="${state.moveInDate || ''}" /><button id="saveDateBtn">save</button></div>` : ''}
  </div>`;
}

function formatMoveInDateTime(dateStr){
  if(!dateStr) return null;
  const [datePart, timePart] = dateStr.split('T');
  const [y, m, dd] = datePart.split('-').map(Number);
  const [hh, mm] = (timePart || '00:00').split(':').map(Number);
  const d = new Date(y, m-1, dd, hh, mm);
  const dateFmt = d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  const timeFmt = d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
  return `${dateFmt}, ${timeFmt}`;
}

function renderBudgetModal(){
  if(!budgetModalOpen) return '';

  const receiptItems = [];
  state.categories.forEach(cat => {
    (cat.items||[]).forEach(it => {
      const subsWithPrice = (it.subitems||[]).filter(s => s.price);
      if(subsWithPrice.length > 0){
        subsWithPrice.forEach(s => {
          receiptItems.push({name: `${it.title} — ${s.text}`, price: Number(s.price), done: !!s.done});
        });
      } else if(it.price){
        receiptItems.push({name: it.title, price: Number(it.price), done: !!it.completed});
      }
    });
  });
  (state.quickList||[]).forEach(q => {
    if(q.price) receiptItems.push({name: q.text, price: Number(q.price), done: !!q.done});
  });

  const totalAll = receiptItems.reduce((s,r)=>s+r.price, 0);
  const totalSpent = receiptItems.filter(r=>r.done).reduce((s,r)=>s+r.price, 0);

  return `<div class="modal-overlay" id="budgetModalOverlay">
    <div class="modal-box" style="max-width:340px; padding:0; background:transparent; box-shadow:none;">
      <div class="modal-closerow"><span class="expand-btn" id="budgetCloseBtn" style="background:var(--paper);">${COLLAPSE_ICON}</span></div>

        <div class="quick-check ${q.done?'done':''}" data-qtoggle="${q.id}"></div>
        <div class="quick-text ${q.done?'done':''}" data-quickeditstart="${q.id}">${escapeHtml(q.text)}${q.price ? ` <span class="quick-price">$${Number(q.price).toFixed(2)}</span>` : ''}</div>
        <span class="quick-del" data-qdel="${q.id}">✕</span>
      </li>`).join('')}
    </ul>`;
  }

  html += `<div class="quick-add-row">
    <input type="text" id="quickAddInput" placeholder="e.g. more hangers…" maxlength="60" />
    <span class="round-plus" id="quickAddBtn">+</span>
  </div></div>`;

  return html;
}

    const editingItem = state.quickList.find(x => x.id === editingQuickId);
    if(editingItem && editingItem.done && !editingItem.price && quickEditPrice){
      quickEditPrice.focus();
      quickEditPrice.select();
    } else {
      quickEditText.focus();
      quickEditText.select();

      if(e.key==='Enter') confirmQuickEdit();
      if(e.key==='Escape'){ editingQuickId=null; render(); }

  let dragSrc = null;
  document.querySelectorAll('[data-dragitem]').forEach(el => {
    el.addEventListener('dragstart', (e) => {
      dragSrc = {itemId: el.getAttribute('data-dragitem'), catId: el.getAttribute('data-dragcat')};
      e.dataTransfer.effectAllowed = 'move';
      el.style.opacity = '0.4';
    });
    el.addEventListener('dragend', () => { el.style.opacity = '1'; dragSrc = null; });
    el.addEventListener('dragover', (e) => { e.preventDefault(); });
    el.addEventListener('drop', (e) => {
      e.preventDefault();
      if(!dragSrc) return;
      const targetCatId = el.getAttribute('data-dragcat');
      const targetItemId = el.getAttribute('data-dragitem');
      if(dragSrc.catId !== targetCatId || dragSrc.itemId === targetItemId) return;
      const cat = state.categories.find(c => c.id === targetCatId);
      if(!cat) return;
      const fromIdx = cat.items.findIndex(i => i.id === dragSrc.itemId);
      const toIdx = cat.items.findIndex(i => i.id === targetItemId);
      if(fromIdx === -1 || toIdx === -1) return;
      const [moved] = cat.items.splice(fromIdx, 1);
      cat.items.splice(toIdx, 0, moved);
      render(); saveData();
    });
  });

  document.querySelectorAll('[data-cardopen]').forEach(el => el.addEventListener('click', (e) => {
    const interactive = e.target.closest('input, textarea, a, .sub-check, .sub-text, .sub-del, .card-del, .mini-plus, .img-del, .link-del, .add-img-btn, .move-bought-btn');
    if(interactive) return;
    openItemId = el.getAttribute('data-cardopen');
    addingSubFor = null; addingLinkFor = null;
    render();
  }));

  document.querySelectorAll('[data-expandtoggle]').forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    openItemId = el.getAttribute('data-expandtoggle');
    addingSubFor = null; addingLinkFor = null;
    render();
  });

  const itemViewOverlay = document.getElementById('itemViewOverlay');
  if(itemViewOverlay) itemViewOverlay.addEventListener('click', (e) => { if(e.target === itemViewOverlay){ openItemId = null; render(); } });
  const itemViewClose = document.getElementById('itemViewClose');
  if(itemViewClose) itemViewClose.onclick = () => { openItemId = null; render(); };

  document.querySelectorAll('[data-carddel]').forEach(el => el.onclick = () => {
    const cat = state.categories.find(c => c.id === el.getAttribute('data-cat'));
    if(cat){ cat.items = cat.items.filter(i => i.id !== el.getAttribute('data-carddel')); render(); saveData(); }
  });

  document.querySelectorAll('[data-togglecompleted]').forEach(el => el.onclick = () => {
    const catId = el.getAttribute('data-cat');
    const cat = state.categories.find(c => c.id === catId);
    const item = cat ? cat.items.find(i => i.id === el.getAttribute('data-togglecompleted')) : null;
    if(item){ item.completed = !item.completed; render(); saveData(); }
  });

  document.querySelectorAll('[data-moodview]').forEach(el => el.onclick = () => {
    const catId = el.getAttribute('data-moodview');
    if(moodViewCats.has(catId)) moodViewCats.delete(catId); else moodViewCats.add(catId);
    render();
  });

  document.querySelectorAll('[data-catimgadd]').forEach(el => {
    el.addEventListener('change', (e) => {
      const catId = el.getAttribute('data-catimgadd');
      const cat = state.categories.find(c => c.id === catId);
      if(!cat) return;
      if(!cat.images) cat.images = [];
      const files = Array.from(e.target.files || []);
      let remaining = files.length;
      if(remaining === 0) return;
      files.forEach(file => {
        compressImage(file, 400, dataUrl => {
          cat.images.push({id: uid(), data: dataUrl});
          remaining--;
          if(remaining === 0){ render(); saveData(); }
        });
      });
    });
  });
  document.querySelectorAll('[data-catimgdel]').forEach(el => el.onclick = () => {
    const cat = state.categories.find(c => c.id === el.getAttribute('data-cat'));
    if(cat){ cat.images = (cat.images||[]).filter(i => i.id !== el.getAttribute('data-catimgdel')); render(); saveData(); }
  });

  // subitems
  document.querySelectorAll('[data-subtoggle]').forEach(el => el.onclick = () => {
    const {item} = findGroup(el.getAttribute('data-cat'), el.getAttribute('data-item'));
    const s = item && item.subitems.find(s => s.id === el.getAttribute('data-subtoggle'));
    if(s){
      s.done = !s.done;
      if(s.done && !s.price){ editingSubId = s.id; }
      render(); saveData();
    }
  });
  document.querySelectorAll('[data-subdel]').forEach(el => el.onclick = () => {
    const {item} = findGroup(el.getAttribute('data-cat'), el.getAttribute('data-item'));
    if(item){ item.subitems = item.subitems.filter(s => s.id !== el.getAttribute('data-subdel')); render(); saveData(); }
  });
  document.querySelectorAll('[data-startsub]').forEach(el => el.onclick = () => { addingSubFor = el.getAttribute('data-startsub'); render(); const inp = document.querySelector(`[data-newsub]`); if(inp) inp.focus(); });
  document.querySelectorAll('[data-newsub]').forEach(el => {
    el.addEventListener('keydown', e => { if(e.key==='Enter') addSub(el.getAttribute('data-cat'), el.getAttribute('data-newsub')); if(e.key==='Escape'){ addingSubFor=null; render(); } });
  });
  document.querySelectorAll('[data-confirmsub]').forEach(el => el.onclick = () => addSub(el.getAttribute('data-cat'), el.getAttribute('data-confirmsub')));

  document.querySelectorAll('[data-subeditstart]').forEach(el => el.onclick = () => {
    editingSubId = el.getAttribute('data-subeditstart');
    render();
  });
  function confirmSubEdit(){
    const input = document.getElementById('subEditInput');
    const priceInput = document.getElementById('subEditPrice');
    if(!input) return;
    const catId = input.getAttribute('data-cat');
    const itemId = input.getAttribute('data-item');
    const subId = input.getAttribute('data-sub');
    const text = input.value.trim();
    const {item} = findGroup(catId, itemId);
    const s = item && item.subitems.find(s => s.id === subId);
    if(s && text){
      s.text = text;
      const priceVal = priceInput ? priceInput.value.trim() : '';
      s.price = priceVal ? (parseFloat(priceVal) || 0) : 0;
    }
    editingSubId = null;
    render(); saveData();
  }
  document.querySelectorAll('[data-subeditconfirm]').forEach(el => el.onclick = confirmSubEdit);
  const subEditInput = document.getElementById('subEditInput');
  const subEditPrice = document.getElementById('subEditPrice');
  if(subEditInput){
    let focusPrice = false;
    if(subEditPrice){
      const {item} = findGroup(subEditInput.getAttribute('data-cat'), subEditInput.getAttribute('data-item'));
      const s = item && item.subitems.find(s => s.id === subEditInput.getAttribute('data-sub'));
      if(s && s.done && !s.price) focusPrice = true;
    }
    if(focusPrice){
      subEditPrice.focus();
      subEditPrice.select();
    } else {
      subEditInput.focus();
      subEditInput.select();
    }
    subEditInput.addEventListener('keydown', e => {
      if(e.key==='Enter') confirmSubEdit();
      if(e.key==='Escape'){ editingSubId=null; render(); }
    });
  }
  if(subEditPrice) subEditPrice.addEventListener('keydown', e => { if(e.key==='Enter') confirmSubEdit(); if(e.key==='Escape'){ editingSubId=null; render(); } });

  // links
  document.querySelectorAll('[data-linkdel]').forEach(el => el.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const {item} = findGroup(el.getAttribute('data-cat'), el.getAttribute('data-item'));
    if(item){ item.links = item.links.filter(l => l.id !== el.getAttribute('data-linkdel')); render(); saveData(); }
  });
  document.querySelectorAll('[data-startlink]').forEach(el => el.onclick = () => { addingLinkFor = el.getAttribute('data-startlink'); render(); const inp = document.querySelector(`[data-newlink]`); if(inp) inp.focus(); });
  document.querySelectorAll('[data-newlink]').forEach(el => {
    el.addEventListener('keydown', e => { if(e.key==='Enter') addLink(el.getAttribute('data-cat'), el.getAttribute('data-newlink')); if(e.key==='Escape'){ addingLinkFor=null; render(); } });
  });
  document.querySelectorAll('[data-confirmlink]').forEach(el => el.onclick = () => addLink(el.getAttribute('data-cat'), el.getAttribute('data-confirmlink')));

  // images
  document.querySelectorAll('[data-imgdel]').forEach(el => el.onclick = () => {
    const {item} = findGroup(el.getAttribute('data-cat'), el.getAttribute('data-item'));
    if(item){ item.images = item.images.filter(i => i.id !== el.getAttribute('data-imgdel')); render(); saveData(); }
  });
  document.querySelectorAll('[data-imgadd]').forEach(el => {
    el.addEventListener('change', (e) => {
      const catId = el.getAttribute('data-cat');
      const itemId = el.getAttribute('data-imgadd');
      const {item} = findGroup(catId, itemId);
      if(!item) return;
      const files = Array.from(e.target.files || []);
      let remaining = files.length;
      if(remaining === 0) return;
      files.forEach(file => {
        compressImage(file, 300, dataUrl => {
          item.images.push({id: uid(), data: dataUrl});
          remaining--;
          if(remaining === 0){ render(); saveData(); }
        });
      });
    });
  });
}

function addSub(catId, itemId){
  const input = document.querySelector(`[data-newsub="${itemId}"]`);
  const text = input.value.trim();
  if(!text) return;
  const {item} = findGroup(catId, itemId);
  if(item){ item.subitems.push({id: uid(), text, done:false}); addingSubFor = null; render(); saveData(); }
}

function addLink(catId, itemId){
  const input = document.querySelector(`[data-newlink="${itemId}"]`);
  let url = input.value.trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const {item} = findGroup(catId, itemId);
  if(item){ item.links.push({id: uid(), url}); addingLinkFor = null; render(); saveData(); }
}

function addCategory(){
  const input = document.getElementById('newCatInput');
  const name = input.value.trim();
  if(!name) return;
  state.categories.push({id: uid(), name, items: [], images: []});
  addingCategory = false; render(); saveData();
}

async function resetAll(){
  if(!confirm('Clear the whole board? This removes every category, item, and the completed pile.')) return;
  if(!confirm('Really sure? This cannot be undone. Everything on the mood board, shopping list stays, but all categories and items will be gone for good.')) return;
  saveLocalBackup(state);
  state = {title: state.title, moveInDate:null, categories:[], bought:[]};
  normalizeState();
  render(); await saveData(true);
}

loadData();
</script>
</body>
</html>
